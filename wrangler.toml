name = "qishui-api"
main = "src/worker.mjs"
compatibility_date = "2026-08-21"
compatibility_flags = ["nodejs_compat"]

[vars]
# ===== 鉴权密钥（必填！所有接口（除 /health、OPTIONS）都要求携带）=====
# 传递方式：X-API-Key 头 / ?key= 参数 / Authorization: Bearer
# ⚠️ 密钥不写在仓库里！部署前必须执行：
#    printf '你的密钥' | npx wrangler secret put API_KEY
# 本地开发可放 .dev.vars（已 gitignore）

# 上游接口地址（默认即可，一般无需改）
# QISHUI_LUNA_API_HOST = "https://beta-luna.douyin.com"
# QISHUI_PC_API_HOST = "https://api.qishui.com"
# QISHUI_MUSIC_SHARE_HOST = "https://music.douyin.com"

# PC 接口签名 header（可选；track 搜索自 2026-08 起要求签名，配置后可恢复）
# 敏感值请用 `npx wrangler secret put QISHUI_X_HELIOS` 存为 Secret 而不是写在这里
# QISHUI_X_HELIOS = "..."

# 固定测试设备标识（可选）
# QISHUI_DEVICE_ID = "1234567890123456"
# QISHUI_INSTALL_ID = "9876543210987654"

# 下载/解密开关与限制
QISHUI_ENABLE_DECRYPT = "true"
QISHUI_DOWNLOAD_MAX_BYTES = "52428800"
QISHUI_DOWNLOAD_ALLOWED_HOSTS = "douyin.com,qishui.com,douyinvod.com,bytedance.com,bytedance.net,byted.org,bytecdn.cn,bytecdntp.com,snssdk.com"

# CORS（默认 * 允许任意来源；想限制可改为具体域名，逗号分隔）
CORS_ALLOW_ORIGIN = "*"

[observability]
enabled = true